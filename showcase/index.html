<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forager showcase</title>
  <meta name="description" content="A static showcase of Forager built from recorded runs: one daily brief, the interest profile and proposed changes, the topic mix, and the Stage 5 evaluation.">
  <link rel="icon" href="bee.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const theme = localStorage.getItem("forager-theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      if (localStorage.getItem("forager-lang") === "zh") document.documentElement.lang = "zh-CN";
    } catch (e) { /* storage blocked: follow the system theme, in English */ }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="logo" src="bee.svg" alt="" width="36" height="36">
        <div>
          <div class="brand-name">Forager</div>
          <div class="brand-tag" id="tagline">Your daily AI brief, rotated for breadth</div>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections"></nav>
      <div class="top-actions">
        <button class="lang-btn" type="button"></button>
        <button class="theme-btn" type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>
  <main>
    <section class="panel" id="panel-brief" role="tabpanel" aria-labelledby="tab-brief"></section>
    <section class="panel" id="panel-interests" role="tabpanel" aria-labelledby="tab-interests" hidden></section>
    <section class="panel" id="panel-topics" role="tabpanel" aria-labelledby="tab-topics" hidden></section>
    <section class="panel" id="panel-evaluation" role="tabpanel" aria-labelledby="tab-evaluation" hidden></section>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
