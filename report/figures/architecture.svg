<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Forager's architecture: setup, daily digest and memory loop">
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="#5b5850"/>
    </marker>
    <style>
      .agent { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.1; }
      .code  { fill: #ecebe5; stroke: #8f8b80; stroke-width: 1.1; }
      .user  { fill: #e5f0e7; stroke: #2f6a3d; stroke-width: 1.1; }
      .data  { fill: #ffffff; stroke: #aaa69a; stroke-width: 1.1; }
      .team  { fill: none; stroke: #2a78d6; stroke-width: 0.8; stroke-dasharray: 3 2; }
      .t  { font-size: 8.8px; font-weight: 700; fill: #141414; }
      .d  { font-size: 7.7px; fill: #3d3b35; }
      .tag { font-size: 7.4px; font-weight: 700; letter-spacing: 0.06em; fill: #5b5850; }
      .lg { font-size: 7.6px; fill: #3d3b35; }
      .flow { fill: none; stroke: #5b5850; stroke-width: 1.05; marker-end: url(#ah); }
      .flow2 { fill: none; stroke: #5b5850; stroke-width: 1.05; marker-start: url(#ah); marker-end: url(#ah); }
      .note { font-size: 7.4px; font-style: italic; fill: #5b5850; }
    </style>
  </defs>

  <!-- row tags -->
  <text class="tag" x="1" y="15">IDEA 1 · SETUP</text>
  <text class="tag" x="599" y="15" text-anchor="end">IDEA 2 · MEMORY (WRITES ONLY AFTER APPROVAL)</text>
  <text class="tag" x="1" y="99">IDEA 3 · DAILY DIGEST</text>

  <!-- top row: setup (left to right) and memory (right to left) meet at the profile -->
  <rect class="user"  x="1"      y="24" width="74" height="44" rx="4"/>
  <text class="t" x="38"  y="38" text-anchor="middle">One sentence</text>
  <text class="d" x="38"  y="49" text-anchor="middle">about what</text>
  <text class="d" x="38"  y="58.5" text-anchor="middle">you follow</text>

  <rect class="agent" x="88.3"   y="24" width="74" height="44" rx="4"/>
  <text class="t" x="125.3" y="38" text-anchor="middle">Clarifier</text>
  <text class="d" x="125.3" y="49" text-anchor="middle">directions with</text>
  <text class="d" x="125.3" y="58.5" text-anchor="middle">option questions</text>

  <rect class="user"  x="175.7"  y="24" width="74" height="44" rx="4"/>
  <text class="t" x="212.7" y="38" text-anchor="middle">User picks</text>
  <text class="d" x="212.7" y="49" text-anchor="middle">options, fields,</text>
  <text class="d" x="212.7" y="58.5" text-anchor="middle">14-day focuses</text>

  <rect class="data"  x="263"    y="24" width="74" height="44" rx="4"/>
  <text class="t" x="300" y="38" text-anchor="middle">Profile</text>
  <text class="d" x="300" y="49" text-anchor="middle">stated · inferred</text>
  <text class="d" x="300" y="58.5" text-anchor="middle">long · short-term</text>

  <rect class="user"  x="350.3"  y="24" width="74" height="44" rx="4"/>
  <text class="t" x="387.3" y="38" text-anchor="middle">User decides</text>
  <text class="d" x="387.3" y="49" text-anchor="middle">SDK pauses the</text>
  <text class="d" x="387.3" y="58.5" text-anchor="middle">write until then</text>

  <rect class="code"  x="437.7"  y="24" width="74" height="44" rx="4"/>
  <text class="t" x="474.7" y="38" text-anchor="middle">Code checks</text>
  <text class="d" x="474.7" y="49" text-anchor="middle">evidence, target,</text>
  <text class="d" x="474.7" y="58.5" text-anchor="middle">no repeat, ≤ 3</text>

  <rect class="agent" x="525"    y="24" width="74" height="44" rx="4"/>
  <text class="t" x="562" y="38" text-anchor="middle">Memory agent</text>
  <text class="d" x="562" y="49" text-anchor="middle">proposes change</text>
  <text class="d" x="562" y="58.5" text-anchor="middle">+ evidence IDs</text>

  <line class="flow" x1="75" y1="46" x2="87.6" y2="46"/>
  <line class="flow" x1="162.3" y1="46" x2="175" y2="46"/>
  <line class="flow" x1="249.7" y1="46" x2="262.3" y2="46"/>
  <line class="flow" x1="350.3" y1="46" x2="337.7" y2="46"/>
  <line class="flow" x1="437.7" y1="46" x2="425" y2="46"/>
  <line class="flow" x1="525" y1="46" x2="512.4" y2="46"/>

  <!-- bottom row: the daily digest -->
  <rect class="team" x="85.3" y="105" width="167.4" height="54" rx="6"/>
  <rect class="data"  x="1"      y="110" width="74" height="44" rx="4"/>
  <text class="t" x="38"  y="124" text-anchor="middle">Candidates</text>
  <text class="d" x="38"  y="135" text-anchor="middle">arXiv · GitHub ·</text>
  <text class="d" x="38"  y="144.5" text-anchor="middle">news, ≤ 24</text>

  <rect class="agent" x="88.3"   y="110" width="74" height="44" rx="4"/>
  <text class="t" x="125.3" y="124" text-anchor="middle">Manager</text>
  <text class="d" x="125.3" y="135" text-anchor="middle">sees IDs, titles;</text>
  <text class="d" x="125.3" y="144.5" text-anchor="middle">asks via as_tool()</text>

  <rect class="agent" x="175.7"  y="110" width="74" height="44" rx="4"/>
  <text class="t" x="212.7" y="124" text-anchor="middle">3 specialists</text>
  <text class="d" x="212.7" y="135" text-anchor="middle">paper, repo, news;</text>
  <text class="d" x="212.7" y="144.5" text-anchor="middle">read source text</text>

  <rect class="code"  x="263"    y="110" width="74" height="44" rx="4"/>
  <text class="t" x="300" y="124" text-anchor="middle">Code checks</text>
  <text class="d" x="300" y="135" text-anchor="middle">team + 4 rules;</text>
  <text class="d" x="300" y="144.5" text-anchor="middle">repair once</text>

  <rect class="agent" x="350.3"  y="110" width="74" height="44" rx="4"/>
  <text class="t" x="387.3" y="124" text-anchor="middle">Critic</text>
  <text class="d" x="387.3" y="135" text-anchor="middle">meaning only;</text>
  <text class="d" x="387.3" y="144.5" text-anchor="middle">PASS or ADJUST</text>

  <rect class="data"  x="437.7"  y="110" width="74" height="44" rx="4"/>
  <text class="t" x="474.7" y="124" text-anchor="middle">Digest</text>
  <text class="d" x="474.7" y="135" text-anchor="middle">points cite items;</text>
  <text class="d" x="474.7" y="144.5" text-anchor="middle">reason labels</text>

  <rect class="data"  x="525"    y="110" width="74" height="44" rx="4"/>
  <text class="t" x="562" y="124" text-anchor="middle">Ratings, likes</text>
  <text class="d" x="562" y="135" text-anchor="middle">kept only if</text>
  <text class="d" x="562" y="144.5" text-anchor="middle">consented</text>

  <line class="flow"  x1="75" y1="132" x2="84.6" y2="132"/>
  <line class="flow2" x1="163" y1="132" x2="175" y2="132"/>
  <line class="flow"  x1="252.7" y1="132" x2="262.3" y2="132"/>
  <line class="flow"  x1="337" y1="132" x2="349.6" y2="132"/>
  <line class="flow"  x1="424.3" y1="132" x2="437" y2="132"/>
  <line class="flow"  x1="511.7" y1="132" x2="524.3" y2="132"/>

  <!-- profile feeds the team; ratings feed the memory agent; ADJUST returns to the team -->
  <path class="flow" d="M300 68 V84 H232 V104.3"/>
  <line class="flow" x1="562" y1="110" x2="562" y2="68.7"/>
  <path class="flow" d="M387.3 154 V168 H125.3 V154.7"/>
  <text class="note" x="300" y="177" text-anchor="middle">ADJUST: the Manager revises once, then the rules run again</text>

  <!-- legend -->
  <g transform="translate(330 186)">
    <rect class="agent" x="0" y="0" width="12" height="8" rx="2"/><text class="lg" x="16" y="7">Agent (LLM)</text>
    <rect class="code" x="66" y="0" width="12" height="8" rx="2"/><text class="lg" x="82" y="7">Code, runs every time</text>
    <rect class="user" x="164" y="0" width="12" height="8" rx="2"/><text class="lg" x="180" y="7">User</text>
    <rect class="data" x="206" y="0" width="12" height="8" rx="2"/><text class="lg" x="222" y="7">Data</text>
  </g>
</svg>
